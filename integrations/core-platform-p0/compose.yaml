services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: company_dsh
      POSTGRES_USER: company_dsh
      POSTGRES_PASSWORD: p0-local-password
    healthcheck:
      test: [CMD-SHELL, pg_isready -U company_dsh -d company_dsh]
      interval: 1s
      timeout: 2s
      retries: 60
    networks: [platform]

  redis:
    image: redis:7-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 2s
      retries: 60
    networks: [platform]

  migrate:
    image: ${P0_CONTROL_PLANE_IMAGE}
    command: [node, packages/db/dist/migrate-platform.js]
    environment:
      DATABASE_URL: postgresql://company_dsh:p0-local-password@postgres:5432/company_dsh
    depends_on:
      postgres: { condition: service_healthy }
    networks: [platform]
    profiles: [ops]

  business-api:
    image: ${P0_BUSINESS_API_IMAGE}
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3102
      DATABASE_URL: postgresql://company_dsh:p0-local-password@postgres:5432/company_dsh
      BUSINESS_REPOSITORY: postgres
      KNOWLEDGE_PROVIDER: fake
      AUTOMATION_PROVIDER: fake
      ACTOR_TOKEN_SECRET: p0-actor-token-secret-at-least-32-characters
      ACTOR_TOKEN_ISSUER: company-control-plane
    depends_on:
      postgres: { condition: service_healthy }
    networks: [platform]

  runner-manager:
    image: ${P0_RUNNER_MANAGER_IMAGE}
    user: '10001:${P0_DOCKER_GID}'
    group_add: ['${P0_DOCKER_GID}']
    environment:
      DATABASE_URL: postgresql://company_dsh:p0-local-password@postgres:5432/company_dsh
      REDIS_URL: redis://redis:6379/0
      INTERNAL_SERVICE_TOKEN: p0-internal-service-token
      RUNNER_IDENTITY_SECRET_BASE64: CAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg=
      RUNNER_DATA_ROOT: ${P0_DATA_ROOT}
      RUNNER_IMAGE: ${P0_RUNNER_IMAGE}
      RUNNER_IMAGE_VERSION: 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca
      RUNNER_INGRESS_NETWORK: ${P0_INGRESS_NETWORK}
      RUNNER_EGRESS_NETWORK: ${P0_EGRESS_NETWORK}
      COMPANY_AGENT_TOOL_GATEWAY_URL: http://control-plane:8080/internal/v1/agent-tools/query-company-system
      RUNNER_MANAGER_HOST: 0.0.0.0
      RUNNER_RECONCILE_INTERVAL_MS: 1000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${P0_DATA_ROOT}:${P0_DATA_ROOT}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [platform, runner-ingress, runner-egress]

  control-plane:
    image: ${P0_CONTROL_PLANE_IMAGE}
    user: '10001:10001'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://company_dsh:p0-local-password@postgres:5432/company_dsh
      INTERNAL_SERVICE_TOKEN: p0-internal-service-token
      MODEL_SECRET_KEY_BASE64: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      RUNNER_IDENTITY_SECRET_BASE64: CAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg=
      RUNNER_MANAGER_URL: http://runner-manager:8081
      RUNNER_DATA_ROOT: ${P0_DATA_ROOT}
      CONTROL_PLANE_HOST: 0.0.0.0
      BUSINESS_API_URL: http://business-api:3102
      ACTOR_TOKEN_SECRET: p0-actor-token-secret-at-least-32-characters
      ACTOR_TOKEN_ISSUER: company-control-plane
      KNOWLEDGE_PROVIDER: fake
      REMOTE_MCP_ENABLED: 'false'
      WORKBENCH_ENTRY_URL: /workbench
      MODEL_BASE_URL_ALLOWLIST: ${P0_MODEL_AUTHORITY}
    volumes:
      - ${P0_DATA_ROOT}:${P0_DATA_ROOT}
    depends_on:
      postgres: { condition: service_healthy }
      runner-manager: { condition: service_started }
      business-api: { condition: service_healthy }
    networks: [platform, runner-ingress]

  gateway:
    image: nginx:1.27-alpine
    ports: ['127.0.0.1:${P0_GATEWAY_PORT}:8080']
    volumes:
      - ../../deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [control-plane]
    networks: [platform]

networks:
  platform:
  runner-ingress:
    name: ${P0_INGRESS_NETWORK}
    internal: true
  runner-egress:
    name: ${P0_EGRESS_NETWORK}
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: 'false'
