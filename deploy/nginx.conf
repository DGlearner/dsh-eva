map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 4m;

  location /chat/ {
    proxy_pass http://control-plane:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location = /chat {
    proxy_pass http://control-plane:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  # The official DSH Web still sends unary RPCs to the origin-level /api path.
  # Keep that upstream contract while routing every request through our chat gateway.
  location /api/ {
    proxy_pass http://control-plane:8080/chat/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location /company-api/v1/ {
    proxy_pass http://control-plane:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  location ^~ /internal {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
